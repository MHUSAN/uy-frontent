<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="O‘zbekiston bo‘ylab ko‘chmas mulkni sotib olish va ijaraga olish."
    />
    <meta name="theme-color" content="#f5f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1310" media="(prefers-color-scheme: dark)" />
    <title>TezUy — O‘zbekistondagi ko‘chmas mulk</title>
    <script>
      ;(() => {
        try {
          const storedTheme = localStorage.getItem('tezuy.theme')
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          const isDark =
            storedTheme === 'dark' ||
            ((!storedTheme || storedTheme === 'system') && prefersDark)

          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'

          const storedLanguage = localStorage.getItem('tezuy.language')
          if (['uz', 'ru', 'en'].includes(storedLanguage)) {
            document.documentElement.lang = storedLanguage
          }
        } catch {
          // Theme and language still fall back to their defaults.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
